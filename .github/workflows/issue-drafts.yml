name: Issue Drafts

# Validates case studies submitted as issues by the browser editor
# (`/contribute/write`) and opens a review pull request when the issue's
# "Ready to publish" box is ticked, or when the author (or a maintainer)
# comments `/publish`.
#

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

concurrency:
  group: issue-draft-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate draft issue
    if: >-
      github.event_name == 'issues' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.body, '- [x] **Ready to publish**') &&
      (
        contains(github.event.issue.labels.*.name, 'article-draft') ||
        contains(github.event.issue.body, '<!-- dri-case-study -->')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check draft fields and Markdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/issue-draft.mjs --validate-only

  publish:
    name: Open publication pull request
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      (
        contains(github.event.issue.labels.*.name, 'article-draft') ||
        contains(github.event.issue.body, '<!-- dri-case-study -->')
      ) &&
      (
        (github.event_name == 'issues' &&
          contains(github.event.issue.body, '- [x] **Ready to publish**')) ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '/publish'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and open publication PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/issue-draft.mjs --publish
